<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estatísticas · Cidade Viva</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="extras.css">
</head>
<body>
<div class="wrap">
  <header class="topo">
    <div>
      <div class="brand"><span class="dot"></span>Cidade Viva · Estatísticas</div>
      <p class="sub">Onde estão os problemas e como a prefeitura está respondendo.</p>
    </div>
    <a class="btn sec" href="admin.html" style="text-decoration:none">Voltar ao painel</a>
  </header>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="resumo" id="resumo"></div>

  <div class="grade-stats">
    <section class="panel"><h2>Por tipo</h2><div class="barras" id="por-tipo"></div></section>
    <section class="panel"><h2>Por status</h2><div class="barras" id="por-status"></div></section>
    <section class="panel"><h2>Bairros com mais denúncias</h2><div class="barras" id="por-bairro"></div></section>
  </div>
</div>
<script src="estatisticas.js"></script>
</body>
</html>
