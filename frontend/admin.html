<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Cidade Viva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <section id="tela-login" class="login panel">
    <div class="brand"><span class="dot"></span>Cidade Viva · Painel</div>
    <h2 style="margin-top:20px">Entrar como moderador</h2>
    <form id="form-login" novalidate>
      <fieldset>
        <label for="email">E-mail</label>
        <input type="text" id="email" inputmode="email" autocomplete="username">
      </fieldset>
      <fieldset>
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password">
      </fieldset>
      <button class="btn main" id="btn-login" type="submit">Entrar</button>
      <div class="msg" id="msg-login" role="status" aria-live="polite"></div>
    </form>
    <a class="trocar" href="inicio.html">Voltar</a>
  </section>

  <!-- PAINEL -->
  <section id="tela-painel" hidden>
    <header class="topo">
      <div>
        <div class="brand"><span class="dot"></span>Cidade Viva · Painel</div>
        <p class="sub" id="ola"></p>
      </div>
      <div class="row">
        <a class="btn sec" href="estatisticas.html" style="text-decoration:none">Estatísticas</a>
        <a class="btn sec" href="inicio.html" style="text-decoration:none">Trocar perfil</a>
        <button class="btn sec" id="btn-sair" type="button">Sair</button>
      </div>
    </header>

    <div class="resumo" id="resumo"></div>

    <div class="barra">
      <input type="text" id="busca" placeholder="Buscar por local ou descrição">
      <div class="filtros" id="filtros-status" style="margin:0"></div>
    </div>

    <div class="msg" id="msg-painel" role="status" aria-live="polite"></div>
    <div class="lista" id="lista-admin"></div>
  </section>

</div>
<script src="admin.js"></script>
</body>
</html>
