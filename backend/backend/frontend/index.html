<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CidadeViva</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="autenticacao">
  <div class="auth-caixa">
    <div class="auth-logo">🌿</div>
    <h1>CidadeViva</h1>
    <p class="auth-slogan" data-i18n="slogan">Sua cidade mais limpa e sustentável</p>

    <div style="margin-bottom:15px;">
      <select id="idiomaAuth" onchange="mudarIdioma(this.value)">
        <option value="pt">🇧🇷 Português</option>
        <option value="en">🇺🇸 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
      </select>
    </div>

    <div class="abas">
      <button id="abaEntrar" class="aba ativa" onclick="mostrarLogin()">Entrar</button>
      <button id="abaCriar" class="aba" onclick="mostrarCadastro()">Criar conta</button>
    </div>

    <form id="formLogin" class="form-auth">
      <label>E-mail <input id="loginEmail" type="email" placeholder="voce@email.com" required></label>
      <label>Senha <input id="loginSenha" type="password" placeholder="••••••" required></label>
      <button class="botao-principal" type="submit">Entrar</button>
    </form>

    <form id="formCadastro" class="form-auth oculto">
      <label>Nome completo <input id="cadNome" type="text" placeholder="Seu nome completo" required></label>
      <label>Número de celular <input id="cadCelular" type="tel" placeholder="(00) 00000-0000" required></label>
      <label>Nome de usuário <input id="cadUsuario" type="text" placeholder="@seuusuario" required></label>
      <label>E-mail <input id="cadEmail" type="email" placeholder="voce@email.com" required></label>
      <label>Senha <input id="cadSenha" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required></label>
      <button class="botao-principal" type="submit">Criar minha conta</button>
    </form>

    <div id="mensagemAuth" class="mensagem"></div>
  </div>
</section>

<section id="aplicativo" class="aplicativo oculto">
  <header class="topo">
    <h1>🌿 CidadeViva</h1>
    <button id="avatarTopo" class="avatar" onclick="navegar('#/perfil')" title="Meu perfil">CV</button>
  </header>

  <main id="conteudo"></main>

  <nav class="menu">
    <button data-rota="#/inicio" onclick="navegar('#/inicio')">🏠<span data-i18n="inicio">Início</span></button>
    <button data-rota="#/denunciar" onclick="navegar('#/denunciar')">📸<span data-i18n="denunciar">Denunciar</span></button>
    <button data-rota="#/noticias" onclick="navegar('#/noticias')">📰<span data-i18n="noticias">Notícias</span></button>
    <button data-rota="#/chat" onclick="navegar('#/chat')">💬<span data-i18n="chat">Chat</span></button>
    <button data-rota="#/perfil" onclick="navegar('#/perfil')">👤<span data-i18n="perfil">Perfil</span></button>
  </nav>
</section>

<div id="toast" class="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
